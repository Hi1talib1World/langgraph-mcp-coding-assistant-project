name: CI/CD Pipeline - AST-Healing-Coder

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-and-test:
    name: Lint, Type Check & Pytest Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Development Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Ruff Static Analysis
        run: |
          ruff check .

      - name: Run Mypy Type Checker
        run: |
          mypy src/ --ignore-missing-imports

      - name: Run Pytest Suite with Coverage
        run: |
          pytest --cov=src --cov-report=xml --cov-report=term

      - name: Upload Coverage to Codecov / Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  build-and-push-ghcr:
    name: Build & Push Sandbox Container Image to GHCR
    needs: lint-and-test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Sandbox Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: security/Dockerfile.sandbox
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/sandbox:latest
            ghcr.io/${{ github.repository }}/sandbox:${{ github.sha }}
